<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务型领导力六维测评</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#18314b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:780px;margin:auto;padding:22px 16px 55px}header{background:linear-gradient(115deg,#12365e,#245e95);color:white;padding:28px 22px;border-radius:18px;margin-bottom:18px}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}.muted{color:#66788b;font-size:13px;line-height:1.7}.card{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 3px 20px #1a3b5c0b}.row{padding:17px 0;border-bottom:1px solid #e9edf2}.row:last-child{border:0}.q{font-size:15px;line-height:1.6;margin-bottom:11px}.opts{display:flex;gap:7px}.opts label{flex:1;text-align:center;border:1px solid #d6e1ea;border-radius:10px;padding:10px 0;cursor:pointer}.opts input{position:absolute;opacity:0}.opts label:has(input:checked){background:#205d94;color:white;border-color:#205d94}input[type=text],select,textarea{padding:12px;width:100%;border:1px solid #ccd9e5;border-radius:10px;font-size:16px;background:white}.context{display:grid;gap:12px;margin-top:18px}.context label{font-size:14px;line-height:2}button{background:#1b5a93;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:15px;cursor:pointer}button.secondary{background:#e7eef6;color:#1d4e79}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.hidden{display:none}.score{display:flex;justify-content:space-between;border-bottom:1px solid #e6edf3;padding:12px 2px}.score b{font-variant-numeric:tabular-nums}canvas{width:100%;max-width:520px;display:block;margin:auto}.note{background:#f3f7fb;padding:14px;border-radius:10px;line-height:1.8;margin:10px 0}.tag{display:inline-block;background:#eaf2fa;padding:4px 9px;border-radius:7px;margin:3px;font-size:13px}@media print{body{background:white}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.wrap{max-width:100%}} </style></head><body><div class="wrap"><header><h1>服务型领导力六维测评</h1><div>项目与团队领导力 · 免费体验版</div></header>
<section id="form"><div class="card"><h2>填写说明</h2><p class="muted">根据最近一段时间的真实表现作答。1＝很少表现，5＝经常表现。请完成全部23题。当前为免费规则建议版，不调用 AI。答案不会自动上传到组织后台，请自行保存报告。请勿填写敏感或保密信息。</p><label>测评姓名（可用昵称）<input id="name" type="text" placeholder="请输入姓名或昵称"></label><div class="context"><label>所属场景<select id="sector"><option value="general">综合／其他项目</option><option value="retail">电商／零售</option><option value="food">餐饮／门店</option><option value="service">咨询／专业服务</option><option value="tech">科技／研发</option><option value="club">社群／活动</option><option value="build">工程／项目交付</option></select></label><label>项目或团队做什么？<input id="project" type="text" maxlength="120" placeholder="例如：8人团队，经营线上文创店"></label><label>团队规模<select id="size"><option>个人项目</option><option>2—5人</option><option>6—15人</option><option>16人以上</option></select></label><label>当前管理挑战（选填）<textarea id="challenge" maxlength="300" rows="3" placeholder="例如：团队任务经常延期"></textarea></label></div></div><div id="qs"></div><div class="actions"><button onclick="submitForm()">生成个人测评报告</button><button class="secondary" onclick="demo()">填入模拟数据</button></div></section>
<section id="report" class="hidden"><div class="card"><h2>个人领导力测评报告</h2><div id="meta" class="muted"></div><canvas id="radar" width="700" height="650"></canvas><p class="muted">雷达图范围为1～5分，各维度为该维度题目平均分；不同维度题数不同，不直接比较总分。</p></div><div class="card"><h2>六维得分</h2><div id="scores"></div></div><div class="card"><h2>测评解读</h2><div id="interpret"></div><h2 style="margin-top:25px">针对性发展建议</h2><div id="advice"></div><p class="muted">本测评用于自我反思与发展规划，不构成经标准化验证的心理诊断或人员绩效评定。请结合实际工作表现理解结果。</p></div><div class="actions noprint"><button onclick="window.print()">打印 / 保存为PDF</button><button class="secondary" onclick="exportCSV()">下载本次结果CSV</button><button class="secondary" onclick="location.reload()">重新测评</button></div></section>
</div><script>
const Q=["我清楚地意识到我们团队应实现的目标。", "我考虑了希望新可能影响到我团队和团队使命的事件。", "我有时间思考自己的愿景并计划如何实现它。", "我知道未来需要的技能。", "必要时，我可以变得大胆和果断。", "我亲自践行对团队成功很重要的价值观。", "我有效地设定团队的目标和策略。", "我有效地把不同团队成员执行任务，并确保他们知道事情的重要信息。", "我在与他人相处时表现出自信。", "我帮助队员理解和认可我们设定的目的。", "我经常提醒队员我们要实现的目标。", "我能很好地沟通，并认真倾听。", "我能迅速决策并清楚地传达决定。", "我了解团队的最新进展。", "我明智地运用人力、资金和物资实现我们的使命。", "我有创造力，并且是一位优秀的问题解决者。", "我有效地管理时间并完成工作。", "我帮助团队成员提高技巧和增加知识。", "我教授和指导队员，以帮助他们面对具体的挑战和解决问题，以及改善不足和人际关系。", "我培养了团队精神。", "我对队员的努力和取得的结果表示赞赏和认可。", "我尊重任何队员提出的想法和观念。", "我提供庆祝成功的机会，表示队员的付出是得到认可的。"];
const groups=[['愿景和价值观',0,6],['指引',6,8],['说服',8,13],['支持',13,17],['培养',17,20],['认可',20,23]];
const suggestions=[
'与伙伴确认下个月最重要的一个目标，写下成果标准及共同遵循的原则。',
'明确关键任务的负责人、完成时间、质量要求，每周同步一次进度。',
'先复述不同意见，再说明自己的建议与理由，邀请大家确认下一步行动。',
'主动了解成员遇到的障碍，协调必要资源并承诺一个跟进时间。',
'选择一项任务让伙伴主导，提供示范、反馈及独立实践的机会。',
'每周具体认可一位伙伴的贡献，说明该行动对项目的积极影响。'
];
const contextMap={general:['阶段目标','任务协作'],retail:['客户体验与订单履约','选品、客服和发货'],food:['顾客体验与门店运营','排班、备货和服务'],service:['客户交付目标','方案、客户对接和交付'],tech:['产品迭代目标','需求、开发和测试'],club:['活动体验目标','筹备、宣传和执行'],build:['安全、质量和进度目标','现场工序、协调和验收']};
function scenarioAdvice(i){const [goal,work]=contextMap[last.sector]||contextMap.general;const acts=[
'第一周明确「'+goal+'」的一个衡量指标；第二周与伙伴对齐目标；第三周检查进展；第四周复盘改进。',
'第一周拆解「'+work+'」的职责；第二周明确负责人；第三周检视交接；第四周完善协作机制。',
'第一周围绕「'+goal+'」收集不同意见；第二周公开说明决策理由；第三周询问理解程度；第四周复盘。',
'第一周找出阻碍「'+goal+'」的问题；第二周协调资源；第三周跟进成效；第四周形成预防措施。',
'第一周选定「'+work+'」中可授权的一件事；第二周示范；第三周跟进反馈；第四周检查独立完成程度。',
'第一周记录一项具体贡献；第二周表达认可；第三周鼓励互相反馈；第四周总结协作变化。'
];return acts[i]+(last.size==='个人项目'?' 可将团队协作理解为与客户、合作伙伴的协作。':'')}

let last=null;
document.getElementById('qs').innerHTML=groups.map(([name,start,end])=>'<div class="card"><h2>'+name+'</h2>'+Q.slice(start,end).map((q,j)=>{let i=start+j;return '<div class="row"><div class="q">'+(i+1)+'. '+q+'</div><div class="opts">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="q'+i+'" value="'+n+'">'+n+'</label>').join('')+'</div></div>'}).join('')+'</div>').join('');
function demo(){document.getElementById('name').value='模拟参与者';document.getElementById('sector').value='retail';document.getElementById('project').value='示例：线上零售团队';Q.forEach((_,i)=>{document.querySelector('input[name=q'+i+'][value="'+([4,4,3,5,4,3,3,4,4,3,4,3,4,3,4,3,4,2,3,3,5,4,4][i])+'"]').checked=true});window.scrollTo({top:0,behavior:'smooth'})}
function submitForm(){const name=document.getElementById('name').value.trim();if(!name){alert('请填写姓名或昵称');return}const a=Q.map((_,i)=>document.querySelector('input[name=q'+i+']:checked')?.value).map(Number);if(a.some(v=>!v)){alert('请先完成全部23道题');return}const scores=groups.map(g=>a.slice(g[1],g[2]).reduce((x,y)=>x+y,0)/(g[2]-g[1]));last={name,date:new Date().toLocaleString('zh-CN'),sector:document.getElementById('sector').value,project:document.getElementById('project').value.trim(),size:document.getElementById('size').value,challenge:document.getElementById('challenge').value.trim(),answers:a,scores};render();document.getElementById('form').classList.add('hidden');document.getElementById('report').classList.remove('hidden');window.scrollTo(0,0)}
function render(){let {name,date,scores}=last;document.getElementById('meta').textContent='姓名：'+name+'　测评时间：'+date+'　项目：'+(last.project||'未填写');document.getElementById('scores').innerHTML=groups.map((g,i)=>'<div class="score"><span>'+g[0]+'</span><b>'+scores[i].toFixed(2)+' / 5.00</b></div>').join('');let order=scores.map((s,i)=>i).sort((a,b)=>scores[b]-scores[a]);let hi=order[0],lo=order[5];document.getElementById('interpret').innerHTML='<div class="note">本次相对较高的维度为<strong>'+groups[hi][0]+'</strong>（'+scores[hi].toFixed(2)+'分），相对较低的维度为<strong>'+groups[lo][0]+'</strong>（'+scores[lo].toFixed(2)+'分）。这些结果反映本次自我评价的相对特点，不等同于外部绩效判断。</div>';document.getElementById('advice').innerHTML=order.slice(-3).reverse().map((i,k)=>'<div class="note"><strong>'+(k+1)+'. '+groups[i][0]+'（'+scores[i].toFixed(2)+'分）</strong><br>'+suggestions[i]+'<br><b>四周提升行动：</b>'+scenarioAdvice(i)+'</div>').join('');draw(scores)}
function draw(s){const c=document.getElementById('radar'),ctx=c.getContext('2d');ctx.clearRect(0,0,700,650);let cx=350,cy=310,r=215;const pt=(i,rad)=>[cx+Math.sin(i*Math.PI/3)*rad,cy-Math.cos(i*Math.PI/3)*rad];ctx.lineWidth=1;for(let ring=1;ring<=5;ring++){ctx.beginPath();for(let i=0;i<6;i++){let [x,y]=pt(i,r*ring/5);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#b9c9d9';ctx.stroke()}for(let i=0;i<6;i++){let [x,y]=pt(i,r);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#cbd5e1';ctx.stroke();let [tx,ty]=pt(i,r+43);ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillStyle='#193d62';ctx.fillText(groups[i][0],tx,ty+6)}ctx.beginPath();s.forEach((v,i)=>{let [x,y]=pt(i,r*v/5);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(35,107,170,.24)';ctx.fill();ctx.strokeStyle='#1d659d';ctx.lineWidth=4;ctx.stroke();ctx.textAlign='left';ctx.font='16px sans-serif';ctx.fillStyle='#6a7c8d';for(let j=1;j<=5;j++)ctx.fillText(j,cx+7,cy-r*j/5+15)}
function exportCSV(){if(!last)return;let h=['姓名','测评时间',...Q.map((_,i)=>'Q'+(i+1)),...groups.map(g=>g[0]),'场景','项目介绍','团队规模','当前挑战'],v=[last.name,last.date,...last.answers,...last.scores.map(n=>n.toFixed(2)),last.sector,last.project,last.size,last.challenge];let esc=x=>'"'+String(x).replace(/"/g,'""')+'"';let csv='\ufeff'+h.map(esc).join(',')+'\n'+v.map(esc).join(',');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='团队领导力测评_'+last.name+'.csv';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
