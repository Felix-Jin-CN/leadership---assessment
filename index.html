<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务型领导力六维测评</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#18314b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:780px;margin:auto;padding:22px 16px 55px}header{background:linear-gradient(115deg,#12365e,#245e95);color:white;padding:28px 22px;border-radius:18px;margin-bottom:18px}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}.muted{color:#66788b;font-size:13px;line-height:1.7}.card{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 3px 20px #1a3b5c0b}.row{padding:17px 0;border-bottom:1px solid #e9edf2}.row:last-child{border:0}.q{font-size:15px;line-height:1.6;margin-bottom:11px}.opts{display:flex;gap:7px}.opts label{flex:1;text-align:center;border:1px solid #d6e1ea;border-radius:10px;padding:10px 0;cursor:pointer}.opts input{position:absolute;opacity:0}.opts label:has(input:checked){background:#205d94;color:white;border-color:#205d94}input[type=text]{padding:12px;width:100%;border:1px solid #ccd9e5;border-radius:10px;font-size:16px}button{background:#1b5a93;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:15px;cursor:pointer}button.secondary{background:#e7eef6;color:#1d4e79}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.hidden{display:none}.score{display:flex;justify-content:space-between;border-bottom:1px solid #e6edf3;padding:12px 2px}.score b{font-variant-numeric:tabular-nums}canvas{width:100%;max-width:520px;display:block;margin:auto}.note{background:#f3f7fb;padding:14px;border-radius:10px;line-height:1.8;margin:10px 0}.tag{display:inline-block;background:#eaf2fa;padding:4px 9px;border-radius:7px;margin:3px;font-size:13px}@media print{body{background:white}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.wrap{max-width:100%}} </style></head><body><div class="wrap"><header><h1>服务型领导力六维测评</h1><div>蜜桃客创业者演讲俱乐部 · 专业测评报告测试版</div></header>
<section id="form"><div class="card"><h2>填写说明</h2><p class="muted">根据最近一段时间的真实表现作答。1＝很少表现，5＝经常表现。请完成全部23题。此页面为本地测试版，暂不向飞书上传数据；个人答案仅在当前浏览器运行时使用。</p><label>测评姓名（可用昵称）<input id="name" type="text" placeholder="请输入姓名或昵称"></label></div><div id="qs"></div><div class="actions"><button onclick="submitForm()">生成个人测评报告</button><button class="secondary" onclick="demo()">填入模拟数据</button></div></section>
<section id="report" class="hidden"><div class="card"><h2>个人领导力测评报告</h2><div id="meta" class="muted"></div><canvas id="radar" width="700" height="650"></canvas><p class="muted">雷达图范围为1～5分，各维度为该维度题目平均分；不同维度题数不同，不直接比较总分。</p></div><div class="card"><h2>六维得分</h2><div id="scores"></div></div><div class="card"><h2>测评解读</h2><div id="interpret"></div><h2 style="margin-top:25px">针对性发展建议</h2><div id="advice"></div><p class="muted">本测评用于自我反思与发展规划，不构成经标准化验证的心理诊断或人员绩效评定。请结合实际工作表现理解结果。</p></div><div class="actions noprint"><button onclick="window.print()">打印 / 保存为PDF</button><button class="secondary" onclick="exportCSV()">下载本次结果CSV</button><button class="secondary" onclick="location.reload()">重新测评</button></div></section>
</div><script>
const Q=["我清楚地意识到我们团队应实现的目标。", "我考虑了希望新可能影响到我团队和团队使命的事件。", "我有时间思考自己的愿景并计划如何实现它。", "我知道未来需要的技能。", "必要时，我可以变得大胆和果断。", "我亲自践行对团队成功很重要的价值观。", "我有效地设定团队的目标和策略。", "我有效地把不同团队成员执行任务，并确保他们知道事情的重要信息。", "我在与他人相处时表现出自信。", "我帮助队员理解和认可我们设定的目的。", "我经常提醒队员我们要实现的目标。", "我能很好地沟通，并认真倾听。", "我能迅速决策并清楚地传达决定。", "我了解团队的最新进展。", "我明智地运用人力、资金和物资实现我们的使命。", "我有创造力，并且是一位优秀的问题解决者。", "我有效地管理时间并完成工作。", "我帮助团队成员提高技巧和增加知识。", "我教授和指导队员，以帮助他们面对具体的挑战和解决问题，以及改善不足和人际关系。", "我培养了团队精神。", "我对队员的努力和取得的结果表示赞赏和认可。", "我尊重任何队员提出的想法和观念。", "我提供庆祝成功的机会，表示队员的付出是得到认可的。"];
const groups=[['愿景和价值观',0,6],['指引',6,8],['说服',8,13],['支持',13,17],['培养',17,20],['认可',20,23]];
const suggestions=[
'在下一次俱乐部例会前，与团队讨论一个明确的阶段目标，并说明目标与俱乐部价值观的联系。',
'为下一次活动制定角色分工表，明确负责人、完成时间与沟通方式，并在会后复盘。',
'在讨论方案时先复述他人的观点，再清楚说明自己的建议、理由及预期效果。',
'主动询问一位承担会议角色的会员需要哪些资源，帮助解决一个具体障碍。',
'在未来一个月辅导一位新会员准备演讲，提供一次具体、可执行的反馈。',
'在下一次例会上具体表扬两位会员的贡献，说明其行为带来的积极影响。'
];
let last=null;
document.getElementById('qs').innerHTML=groups.map(([name,start,end])=>'<div class="card"><h2>'+name+'</h2>'+Q.slice(start,end).map((q,j)=>{let i=start+j;return '<div class="row"><div class="q">'+(i+1)+'. '+q+'</div><div class="opts">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="q'+i+'" value="'+n+'">'+n+'</label>').join('')+'</div></div>'}).join('')+'</div>').join('');
function demo(){document.getElementById('name').value='模拟会员';Q.forEach((_,i)=>{document.querySelector('input[name=q'+i+'][value="'+([4,4,3,5,4,3,3,4,4,3,4,3,4,3,4,3,4,2,3,3,5,4,4][i])+'"]').checked=true});window.scrollTo({top:0,behavior:'smooth'})}
function submitForm(){const name=document.getElementById('name').value.trim();if(!name){alert('请填写姓名或昵称');return}const a=Q.map((_,i)=>document.querySelector('input[name=q'+i+']:checked')?.value).map(Number);if(a.some(v=>!v)){alert('请先完成全部23道题');return}const scores=groups.map(g=>a.slice(g[1],g[2]).reduce((x,y)=>x+y,0)/(g[2]-g[1]));last={name,date:new Date().toLocaleString('zh-CN'),answers:a,scores};render();document.getElementById('form').classList.add('hidden');document.getElementById('report').classList.remove('hidden');window.scrollTo(0,0)}
function render(){let {name,date,scores}=last;document.getElementById('meta').textContent='姓名：'+name+'　测评时间：'+date;document.getElementById('scores').innerHTML=groups.map((g,i)=>'<div class="score"><span>'+g[0]+'</span><b>'+scores[i].toFixed(2)+' / 5.00</b></div>').join('');let order=scores.map((s,i)=>i).sort((a,b)=>scores[b]-scores[a]);let hi=order[0],lo=order[5];document.getElementById('interpret').innerHTML='<div class="note">本次相对较高的维度为<strong>'+groups[hi][0]+'</strong>（'+scores[hi].toFixed(2)+'分），相对较低的维度为<strong>'+groups[lo][0]+'</strong>（'+scores[lo].toFixed(2)+'分）。这些结果反映本次自我评价的相对特点，不等同于外部绩效判断。</div>';document.getElementById('advice').innerHTML=order.slice(-3).reverse().map((i,k)=>'<div class="note"><strong>'+(k+1)+'. '+groups[i][0]+'（'+scores[i].toFixed(2)+'分）</strong><br>'+suggestions[i]+'</div>').join('');draw(scores)}
function draw(s){const c=document.getElementById('radar'),ctx=c.getContext('2d');ctx.clearRect(0,0,700,650);let cx=350,cy=310,r=215;const pt=(i,rad)=>[cx+Math.sin(i*Math.PI/3)*rad,cy-Math.cos(i*Math.PI/3)*rad];ctx.lineWidth=1;for(let ring=1;ring<=5;ring++){ctx.beginPath();for(let i=0;i<6;i++){let [x,y]=pt(i,r*ring/5);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#b9c9d9';ctx.stroke()}for(let i=0;i<6;i++){let [x,y]=pt(i,r);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#cbd5e1';ctx.stroke();let [tx,ty]=pt(i,r+43);ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillStyle='#193d62';ctx.fillText(groups[i][0],tx,ty+6)}ctx.beginPath();s.forEach((v,i)=>{let [x,y]=pt(i,r*v/5);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(35,107,170,.24)';ctx.fill();ctx.strokeStyle='#1d659d';ctx.lineWidth=4;ctx.stroke();ctx.textAlign='left';ctx.font='16px sans-serif';ctx.fillStyle='#6a7c8d';for(let j=1;j<=5;j++)ctx.fillText(j,cx+7,cy-r*j/5+15)}
function exportCSV(){if(!last)return;let h=['姓名','测评时间',...Q.map((_,i)=>'Q'+(i+1)),...groups.map(g=>g[0])],v=[last.name,last.date,...last.answers,...last.scores.map(n=>n.toFixed(2))];let esc=x=>'"'+String(x).replace(/"/g,'""')+'"';let csv='\ufeff'+h.map(esc).join(',')+'\n'+v.map(esc).join(',');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='服务型领导力测评_'+last.name+'.csv';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
